name: One-time portfolio performance fix
on:
  push:
    branches: [portfolio-real-shots-perf-final-2026-08-30]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: portfolio-real-shots-perf-final-2026-08-30
      - name: Remove long-grid reveal gate and rebuild portfolio
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('build.py')
          s=p.read_text(encoding='utf-8')
          old='''    <div class="stagger work-grid">\n{cards}\n    </div>\n    <p id="no-results"'''
          new='''    <div class="work-grid">\n{cards}\n    </div>\n    <p id="no-results"'''
          assert old in s, 'portfolio grid marker not found'
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          python3 -m py_compile build.py
          python3 build.py
          grep -q '<div class="work-grid">' portfolio.html
          ! grep -q '<div class="stagger work-grid">' portfolio.html
          git diff --check
      - name: Commit only durable source and generated portfolio
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/portfolio-perf-once.yml
          git add build.py portfolio.html
          git commit -m 'perf: show portfolio projects immediately'
          git push origin HEAD:portfolio-real-shots-perf-final-2026-08-30
