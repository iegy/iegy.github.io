name: Temporary portfolio performance runner

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/portfolio-fastfix-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply fix on isolated branch only
        run: |
          git fetch origin portfolio-real-shots-fastfix-2026-08-30
          git switch -C portfolio-real-shots-fastfix-2026-08-30 origin/portfolio-real-shots-fastfix-2026-08-30
          python3 - <<'PY'
          from pathlib import Path
          p=Path('build.py')
          s=p.read_text(encoding='utf-8')
          old='''    <div class="stagger work-grid">\n{cards}\n    </div>\n    <p id="no-results"'''
          new='''    <div class="work-grid">\n{cards}\n    </div>\n    <p id="no-results"'''
          assert old in s, 'portfolio grid marker not found'
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          python3 -m py_compile build.py
          python3 build.py
          grep -q '<div class="work-grid">' portfolio.html
          ! grep -q '<div class="stagger work-grid">' portfolio.html
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add build.py portfolio.html
          git commit -m 'perf: show portfolio projects immediately'
          git push origin HEAD:portfolio-real-shots-fastfix-2026-08-30
