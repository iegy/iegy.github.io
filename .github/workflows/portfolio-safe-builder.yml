# One-time safety workflow: public-site changes are written to a separate branch only.
name: Safe polish new portfolio projects

on:
  push:
    branches: [main]
    paths:
      - '.github/portfolio_generate_art.py'
      - '.github/workflows/portfolio-safe-builder.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  polish-feature-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check out isolated generated branch
        run: |
          git switch -C portfolio-projects-generated-2026-08-30 origin/portfolio-projects-generated-2026-08-30
          git checkout origin/main -- .github/portfolio_generate_art.py
      - name: Polish wording and rebuild canonical generated pages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ['projects.py','knowledge.js']:
              p=Path(name); s=p.read_text(encoding='utf-8')
              s=s.replace('أذكار ورقية شرعية', 'أذكار ورُقية شرعية')
              s=s.replace('أذكار ورقية وسبحة', 'أذكار ورُقية وسبحة')
              s=s.replace('عايز تضيف تطبيق تالت؟', 'عايز تضيف تطبيق جديد؟')
              p.write_text(s,encoding='utf-8')
          PY
          python3 -m py_compile projects.py build.py
          node --check knowledge.js
          python3 build.py
          printf '\n' > .nojekyll
      - name: Generate optimized project artwork
        run: |
          python3 -m pip install --quiet pillow
          python3 .github/portfolio_generate_art.py
          rm .github/portfolio_generate_art.py
      - name: Validate complete isolated branch
        run: |
          python3 - <<'PY'
          import projects
          from pathlib import Path
          from PIL import Image
          assert len(projects.PROJECTS)==16
          assert [p['slug'] for p in projects.PROJECTS[-3:]]==['rafiqi-web','rafiqi-android','adwya']
          for slug in ['rafiqi-web','rafiqi-android','adwya']:
              assert Path(f'work-{slug}.html').exists()
              assert Image.open(f'cover-{slug}.webp').size==(1600,1000)
              assert Image.open(f'thumb-{slug}.webp').size==(880,550)
          assert Path('.nojekyll').read_bytes()==b'\n'
          assert 'data-count="16"' in Path('index.html').read_text(encoding='utf-8')
          assert 'https://rafiqi.iegy.net/download/Rafiqi.apk' in Path('knowledge.js').read_text(encoding='utf-8')
          assert 'https://adwya.iegy.net/' in Path('knowledge.js').read_text(encoding='utf-8')
          PY
          node --check knowledge.js
          git diff --check
      - name: Commit polish only to isolated branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projects.py knowledge.js '*.html' sitemap.xml robots.txt site.webmanifest .nojekyll 'cover-*.webp' 'thumb-*.webp'
          git commit -m 'chore: polish new project content and artwork'
          git push origin HEAD:portfolio-projects-generated-2026-08-30
