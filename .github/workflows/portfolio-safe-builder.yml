# One-time safety workflow: public-site changes are written to a separate branch only.
name: Safe build new portfolio projects

on:
  push:
    branches: [main]
    paths:
      - '.github/portfolio_safe_update.py'
      - '.github/workflows/portfolio-safe-builder.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-feature-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Create isolated generated branch
        run: |
          git switch -c portfolio-projects-generated-2026-08-30
      - name: Apply boundary hotfix to one-time updater
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/portfolio_safe_update.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace('return text[:start] + body + text[end:]', 'return text[:start] + body + text[end+1:]')
          s=s.replace('kb = kb.replace(insert_before, new_topics + insert_before, 1)', 'kb = kb.replace(insert_before, new_topics + insert_before[1:], 1)')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Apply and validate portfolio update
        run: |
          python3 .github/portfolio_safe_update.py
          git diff --check
      - name: Commit generated site only to feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projects.py knowledge.js '*.html' sitemap.xml robots.txt site.webmanifest .nojekyll
          git commit -m 'feat: add Rafiqi web, Rafiqi Android and ADWYA projects'
          git push origin HEAD:portfolio-projects-generated-2026-08-30
