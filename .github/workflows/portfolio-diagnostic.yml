name: Portfolio diagnostic

on:
  push:
    branches: [portfolio-new-projects-2026-08-30]
    paths:
      - '.github/workflows/portfolio-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect portfolio structures
        run: |
          python3 - <<'PY'
          import projects, re
          print('PROJECT_COUNT', len(projects.PROJECTS))
          for p in projects.PROJECTS:
              print('PROJECT', p.get('n'), p.get('slug'), '|', p.get('title'), '|', p.get('cats'), '|', p.get('url'), '|gift=', p.get('gift',False))
          print('DOWNLOAD_KEYS', sorted(projects.DOWNLOADS))
          text=open('knowledge.js',encoding='utf-8').read()
          print('KNOWLEDGE_BYTES',len(text.encode('utf-8')))
          for needle in ['شوف المشاريع','مشاريع','NewShop','Omega Care','رِفق','ذِكري']:
              i=text.find(needle)
              if i>=0:
                  lo=max(0,i-260); hi=min(len(text),i+700)
                  print('--- SNIPPET',needle,'---')
                  print(text[lo:hi].replace('\n',' '))
          print('TOPICS_MARKER_COUNT', text.count('topics:['))
          PY
