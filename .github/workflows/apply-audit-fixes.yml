name: Apply audited SEO and UX fixes

on:
  push:
    branches:
      - audit-seo-ux-2026-08-27
    paths:
      - scripts/apply_audit_fixes.py
      - .github/workflows/apply-audit-fixes.yml

permissions:
  contents: write

jobs:
  apply-fixes:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: audit-seo-ux-2026-08-27
          fetch-depth: 0

      - name: Apply fixes and rebuild
        run: python3 scripts/apply_audit_fixes.py

      - name: Validate diff
        run: git diff --check

      - name: Commit generated changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: apply SEO, privacy and accessibility audit"
          git push origin HEAD:audit-seo-ux-2026-08-27
