name: Temporary portfolio source cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/portfolio-source-cleanup-once.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore blog stagger only on isolated branch
        run: |
          git fetch origin portfolio-real-shots-fastfix-2026-08-30
          git switch -C portfolio-real-shots-fastfix-2026-08-30 origin/portfolio-real-shots-fastfix-2026-08-30
          python3 - <<'PY'
          from pathlib import Path
          p=Path('build.py')
          s=p.read_text(encoding='utf-8')
          head, tail = s.split('def blog():', 1)
          assert '<div class="work-grid">\n{cards}' in head
          assert '<div class="work-grid">\n{cards}' in tail
          tail = tail.replace('<div class="work-grid">\n{cards}', '<div class="stagger work-grid">\n{cards}', 1)
          p.write_text(head + 'def blog():' + tail, encoding='utf-8')
          PY
          python3 -m py_compile build.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add build.py
          git commit -m 'chore: keep blog reveal behavior unchanged'
          git push origin HEAD:portfolio-real-shots-fastfix-2026-08-30
